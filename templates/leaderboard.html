<!DOCTYPE html>
<html>
<head>
    <title>{{ animal }} Leaderboard</title>
</head>
<body>
    <h1>Leaderboard of {{ animal }} sightings</h1>

    <table>
        {% for observer, count in leaderboard %}
            <tr>
                <td>{{ loop.index }}.</td>
                <td><strong>User:</strong> {{ observer }}</td>
                <td><strong>Count:</strong> {{ count }}</td>
            </tr>
        {% endfor %}
    </table>
</body>
</html>
